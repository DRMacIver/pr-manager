[project]
name = "pr-manager"
version = "0.1.0"
description = "Terminal UI for managing GitHub PRs with Claude Code agents"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.121.0",
    # 0.2.134 bundles Claude Code CLI 2.1.226; older releases bundle CLIs
    # that reject newer model aliases (e.g. 0.1.54 bundles 2.1.90, which
    # predates "fable").
    "claude-agent-sdk>=0.2.134",
    "textual>=0.80.0",
]

[project.scripts]
pr-manager = "pr_manager:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pr_manager"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
